<!DOCTYPE html>
<html lang="te">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="description" content="CivicProof GIS - Facility discovery and navigation for Godavari Pushkaram 2027" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>CivicProof GIS — Godavari Pushkaralu 2027</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('civicproof_theme');
          var mode = null;
          if (stored) {
            var parsed = JSON.parse(stored);
            mode = parsed && parsed.state ? parsed.state.mode : null;
          }
          if (!mode || (mode !== 'light' && mode !== 'dark')) {
            mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (mode === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
